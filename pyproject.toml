[project]
name = "prewarning"
version = "2.2.0"
requires-python = ">=3.14"
dependencies = [
    "console-menu==0.8.0",
    "decorator==5.3.1",
    "gpytranslate>=2.1.0",
    "edge-tts>=7.2.8",
    "imurl==0.2.1",
    "natsort==8.4.0",
    "pycountry>=24.6.1",
    "pymysql==1.2.0",
    "ruamel.yaml==0.19.1",
    "watchdog==6.0.0",
    "wxpython==4.2.5",
    "miniaudio>=1.71",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyinstaller>=6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
    "types-decorator>=5.2.0.20260508",
    "types-pymysql>=1.1.0.20260508",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
prewarning = "prewarning:main"

[tool.mypy]
exclude = [
    "dist/",
    "build/",
]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["wx.*", "consolemenu", "consolemenu.*", "wx", "consolemenu", "miniaudio"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
exclude = ["dist", "build"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
