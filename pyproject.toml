[project]
name = "prewarning"
version = "2.2.0"
requires-python = ">=3.10"
dependencies = [
    "console-menu==0.8.0",
    "decorator==5.2.1",
    "imurl==0.2.1",
    "natsort==8.4.0",
    "pymysql==1.1.3",
    "ruamel.yaml==0.19.1",
    "watchdog==6.0.0",
    "wxpython==4.2.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
prewarning = "prewarning:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
