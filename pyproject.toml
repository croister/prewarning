[project]
name = "prewarning"
version = "2.3.0-dev"
requires-python = ">=3.14"
dependencies = [
    "console-menu==0.8.0",
    "decorator==5.3.1",
    "gpytranslate==2.1.0",
    "edge-tts==7.2.8",
    "imurl==0.2.1",
    "natsort==8.4.0",
    "pycountry==26.2.16",
    "pymysql==1.2.0",
    "ruamel.yaml==0.19.1",
    "watchdog==6.0.0",
    "wxpython==4.3.1",
    "miniaudio==1.71",
]

[dependency-groups]
dev = [
    "babel==2.18.0",
    "mypy==2.3.1",
    "pyinstaller==6.22.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
    "types-decorator==5.2.0.20260712",
    "types-pymysql==1.2.0.20260807",
]
lint = [
    "babel==2.18.0",
    "codespell==2.4.3",
    "ruff==0.16.3",
    "yamllint==1.38.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
prewarning = "prewarning:main"

[tool.mypy]
exclude = [
    "dist/",
    "build/",
]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["wx.*", "consolemenu", "consolemenu.*", "wx", "consolemenu", "miniaudio"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
exclude = ["dist", "build"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
